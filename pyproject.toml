[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "count-de-benchmark"
version = "0.1.0"
description = "Lightweight RNA-seq differential expression with a simulation benchmark of power and FDR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
countde = "countde.cli:main"

[tool.setuptools]
packages = ["countde"]

[tool.pytest.ini_options]
testpaths = ["tests"]
